server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same mapping as the Vite dev proxy, pointed at the dockerised PHP backend
  # (service `app` on the bistro_default network).
  location /api/ {
    proxy_pass http://app/bistro/api/;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://app/bistro/assets/uploads/;
    proxy_set_header Host localhost;
  }

  location / {
    try_files $uri /index.html;
  }
}
